server {
    server_name _;

    listen 8181;
    access_log off;
    root /usr/share/nginx/html;

    # Traefik sends every hostname under HOST_DOMAIN that has no route of its
    # own here. Every path answers 404 with the "Service not found!" page, so a
    # status code tells "no route" apart from a working app. This used to answer
    # 200 for / and /index.html, which looked like a running app.
    #
    # Traefik's error-page middleware also fetches this page, by the path
    # /index.html, and keeps the original status; it uses the body it gets
    # back, so the page is still shown although it now comes with a 404.
    location / {
        return 404;
    }

    error_page 404 @service-not-found;

    location @service-not-found {
        try_files /index.html =404;
    }
}
